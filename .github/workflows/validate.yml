name: Validate site and data contracts

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test collector without calling the live API
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Test dashboard and static site
        run: node --test tests/*.test.mjs
